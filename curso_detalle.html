<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle del curso — Posgrado UACO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#214b46; --primary-c:#3a635e; --on-p:#fff; --on-pc:#b2ddd7;
  --surf:#f9f9f8; --surf-lo:#f3f4f2; --surf-c:#eeeeed; --surf-hi:#e8e8e7; --surf-hx:#e2e3e1;
  --sec-c:#cfe6f2; --on-s:#1a1c1b; --on-sv:#404847; --ov:#c0c8c6; --err:#ba1a1a;
  --fh:'Public Sans',sans-serif; --fb:'Inter',sans-serif;
  --r:12px; --rsm:8px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --shm:0 2px 8px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--fb);background:var(--surf);color:var(--on-s);display:flex;flex-direction:column;}
h1,h2,h3,h4{font-family:var(--fh);}

.hdr{height:58px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;position:sticky;top:0;z-index:100;}
.hdr-name{font-family:var(--fh);font-size:15px;font-weight:700;}
.hdr-sub{font-size:12px;opacity:.7;margin-top:1px;}
.av{width:34px;height:34px;border-radius:50%;background:var(--on-pc);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--primary);}

.app-body{display:flex;flex:1;overflow:hidden;}

.sb{width:220px;background:#fff;border-right:1px solid var(--ov);display:flex;flex-direction:column;flex-shrink:0;padding:16px 10px;}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--rsm);font-size:13.5px;font-weight:500;color:var(--on-sv);cursor:pointer;text-decoration:none;transition:all .15s;margin-bottom:2px;}
.sb-item:hover{background:var(--surf-c);color:var(--on-s);}
.sb-item.on{background:var(--on-pc);color:var(--primary);font-weight:600;}
.sb-ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

.main{flex:1;overflow-y:auto;padding:32px 28px;}
.wrap{max-width:820px;}

.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--on-sv);text-decoration:none;margin-bottom:18px;}
.back:hover{color:var(--primary);}
.back svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

.card{background:#fff;border:1px solid var(--ov);border-radius:var(--r);padding:22px 24px;box-shadow:var(--sh);margin-bottom:16px;}
.card-sec-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--on-s);margin-bottom:16px;}
.card-sec-title svg{width:16px;height:16px;fill:none;stroke:var(--primary);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

.badge-curso{display:inline-block;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;background:var(--on-pc);color:var(--primary);margin-bottom:12px;}
.badge-open{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;white-space:nowrap;display:inline-block;}
.badge-closed{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#fdecea;color:#c62828;border:1px solid #ef9a9a;white-space:nowrap;display:inline-block;}
.pill-on{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--on-pc);color:var(--primary);display:inline-block;}
.pill-off{display:inline-block;width:34px;height:18px;border-radius:20px;background:var(--surf-hi);position:relative;}
.pill-off::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);}

.d-title{font-family:var(--fh);font-size:24px;font-weight:900;letter-spacing:-.02em;margin-bottom:18px;}

.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;}
@media(max-width:560px){.f-grid{grid-template-columns:1fr;}}
.f-item{min-width:0;}
.f-lbl{font-size:10.5px;font-weight:700;color:var(--on-sv);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.f-val{font-size:13.5px;color:var(--on-s);line-height:1.5;word-break:break-word;}
.f-val.muted{color:var(--ov);}
.f-val a{color:var(--primary);text-decoration:none;font-weight:600;}
.f-val a:hover{text-decoration:underline;}

.divider{height:1px;background:var(--ov);margin:16px 0;}

.links-list{display:flex;flex-direction:column;gap:10px;}
.link-row{display:flex;align-items:center;gap:8px;font-size:13.5px;}
.link-row a{color:var(--primary);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:5px;}
.link-row a:hover{text-decoration:underline;}
.link-row a svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.link-row.muted{color:var(--ov);}

.empty{text-align:center;padding:60px 20px;color:var(--on-sv);font-size:13.5px;font-weight:500;}
.sp{display:inline-block;width:14px;height:14px;border:2px solid var(--ov);border-top-color:var(--primary);border-radius:50%;animation:sp .6s linear infinite;margin-right:8px;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header class="hdr">
  <div>
    <div class="hdr-name">Secretaría de Investigación y Postgrado</div>
    <div class="hdr-sub">Unidad Académica Caleta Olivia - Universidad Nacional de la Patagonia Austral</div>
  </div>
  <div class="av">AD</div>
</header>

<div class="app-body">
  <nav class="sb" aria-label="Navegación principal">
    <a class="sb-item on" href="index.html">
      <span class="sb-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
      Inicio
    </a>
    <a class="sb-item" href="herramientas.html">
      <span class="sb-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg></span>
      Herramientas
    </a>
    <a class="sb-item" href="index.html">
      <span class="sb-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg></span>
      Configuración
    </a>
  </nav>

  <main class="main">
    <div class="wrap">
      <a class="back" href="index.html">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Volver a Inicio
      </a>
      <div id="content">
        <div class="empty"><span class="sp"></span>Cargando información del curso...</div>
      </div>
    </div>
  </main>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0GSXOmsD9GEvr8NsomWkFkvXLDcNrMoSiFivLLDVGx4CmogXKuQ5AFul95wXBX4RQ5g/exec';

const params = new URLSearchParams(window.location.search);
const nombreParam = params.get('nombre') || '';
const nameOrigParam = params.get('nameOrig') || '';

function normNombre(n) {
  return (n || '').replace(/^\d{4}\s*[-–]\s*/i,'')
    .replace(/\s*\(File responses\)\s*$/i,'')
    .replace(/\s*\(respuestas de formulario\s*\d*\)\s*$/i,'')
    .replace(/\s*\(respuestas\)\s*$/i,'')
    .replace(/["'`«»""'']/g,'')
    .trim();
}
function stripAcc(s) {
  return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function normCurso(s) {
  return stripAcc(s)
    .replace(/^\d{4}\s*[-–]\s*/i,'')
    .replace(/^(taller|curso|seminario)(\s+de\s+postgrado)?\s*/i,'')
    .replace(/\s+/g,' ').trim();
}
// Busca una columna cuyo encabezado contenga TODOS los términos dados (sin acentos)
function findCol(header, ...terms) {
  return header.findIndex(h => {
    const n = stripAcc(h);
    return terms.every(t => n.includes(stripAcc(t)));
  });
}
function cell(row, idx) {
  return idx >= 0 ? (row[idx] ?? '').toString().trim() : '';
}

function esc(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fieldHtml(lbl, val, opts) {
  opts = opts || {};
  const isEmpty = !val || val === '—' || val.trim() === '';
  let inner;
  if (isEmpty) {
    inner = '<span class="f-val muted">—</span>';
  } else if (opts.link) {
    inner = `<div class="f-val"><a href="${esc(val)}" target="_blank" rel="noopener">${esc(opts.linkLabel || 'Ver enlace')} ↗</a></div>`;
  } else if (opts.pill) {
    inner = `<div><span class="pill-on">${esc(val)}</span></div>`;
  } else {
    inner = `<div class="f-val">${esc(val)}</div>`;
  }
  return `<div class="f-item"><div class="f-lbl">${esc(lbl)}</div>${inner}</div>`;
}

function isUrl(s) {
  return /^https?:\/\//i.test((s || '').trim());
}

async function cargar() {
  const content = document.getElementById('content');
  document.title = (nombreParam || 'Curso') + ' — Posgrado UACO';

  // 1. Datos básicos ya cargados por el dashboard (más rápidos y con inscriptos reales)
  let base = null;
  try {
    const stored = JSON.parse(sessionStorage.getItem('cursosData') || '[]');
    base = stored.find(c => normCurso(c.nombre) === normCurso(nombreParam)) ||
           stored.find(c => (c.name || '') === nameOrigParam) || null;
  } catch(e) {}

  // 2. Datos completos de la planilla de implementación
  let row = null, header = null;
  try {
    const r = await fetch(`${SCRIPT_URL}?action=getImplementacion`);
    const d = await r.json();
    if (!d.error && d.values && d.values.length > 1) {
      header = d.values[0];
      const cNombre = findCol(header, 'denominacion');
      const rows = d.values.slice(1);
      row = rows.find(r => normCurso(cell(r, cNombre)) === normCurso(nombreParam));
      if (!row) {
        row = rows.find(r => {
          const rn = normCurso(cell(r, cNombre));
          const qn = normCurso(nombreParam);
          return rn && qn && (rn.includes(qn) || qn.includes(rn));
        });
      }
    }
  } catch(e) {}

  if (!base && !row) {
    content.innerHTML = '<div class="empty">No se encontró información para este curso.<br>Volvé a Inicio y hacé click en "Actualizar →" antes de ver el detalle.</div>';
    return;
  }

  const get = (...terms) => row && header ? cell(row, findCol(header, ...terms)) : '';

  const nombre = nombreParam || (base && base.nombre) || get('denominacion');
  const cargaHoraria = (base && base.cargaHoraria) || get('carga', 'horaria');
  const fecha = (base && base.fecha) || get('fecha');
  const docenteResp = (base && base.docente) || get('docente', 'responsable');
  const inscriptos = base ? base.inscriptos : get('cantidad', 'inscript') || get('inscript');
  const abierto = base ? base.abierto : null;

  const estadoCurso = get('estado', 'curso');
  const docenteColab = get('docente', 'colaborador');
  const docenteLog = get('docente', 'logist');
  const unpaBimodal = get('unpa', 'bimodal');
  const cargaBimodal = get('carga', 'bimodal') || get('estudiantes', 'bimodal');
  const videoconf = get('videoconferencia');
  const infoDocVideo = get('info', 'video') || get('info', 'docentes', 'video');
  const estadoForm = get('estado', 'formulario');
  const observaciones = get('observacion');
  const linkForm = get('link', 'formulario') || get('formulario', 'inscripcion');

  const estadoBadge = abierto === true ? '<span class="badge-open">● Abierta</span>'
    : abierto === false ? '<span class="badge-closed">● Cerrada</span>' : '';

  content.innerHTML = `
    <div class="card">
      <span class="badge-curso">Curso</span>
      <div class="d-title">${esc(nombre)}</div>
      <div class="f-grid">
        ${fieldHtml('Carga Horaria', cargaHoraria)}
        ${fieldHtml('Fechas de realización', fecha)}
        ${fieldHtml('Estado del curso', estadoCurso || (estadoBadge ? '' : ''))}
        <div class="f-item">
          <div class="f-lbl">Inscriptos</div>
          <div class="f-val">${inscriptos !== '' && inscriptos != null ? esc(inscriptos) : '<span class="muted">—</span>'} ${estadoBadge}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-sec-title">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Docentes
      </div>
      <div class="f-grid">
        <div class="f-item" style="grid-column:1/-1">
          <div class="f-lbl">Docente/s Responsable/s</div>
          <div class="f-val">${docenteResp ? esc(docenteResp) : '<span class="muted">—</span>'}</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="f-grid">
        ${fieldHtml('Docente Colaborador', docenteColab)}
        ${fieldHtml('Docente Logístico', docenteLog)}
      </div>
    </div>

    <div class="card">
      <div class="card-sec-title">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Logística
      </div>
      <div class="f-grid">
        ${fieldHtml('UNPA Bimodal', unpaBimodal)}
        ${fieldHtml('Carga estudiantes Bimodal', cargaBimodal)}
      </div>
      <div class="divider"></div>
      <div class="f-grid">
        ${fieldHtml('Videoconferencia', videoconf)}
        ${fieldHtml('Info docentes video', infoDocVideo)}
      </div>
    </div>

    <div class="card">
      <div class="card-sec-title">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Estado e inscripciones
      </div>
      <div class="f-grid">
        ${fieldHtml('Estado del formulario', estadoForm)}
        ${fieldHtml('Observaciones', observaciones)}
      </div>
    </div>

    <div class="card">
      <div class="card-sec-title">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
        Enlaces
      </div>
      <div class="links-list">
        ${isUrl(linkForm)
          ? `<div class="link-row"><a href="${esc(linkForm)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>Formulario de inscripción</a></div>`
          : `<div class="link-row muted">Formulario de inscripción — sin enlace cargado</div>`}
      </div>
    </div>
  `;
}

cargar();
</script>
</body>
</html>
